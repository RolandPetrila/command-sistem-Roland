[project]
name = "roland-command-center"
version = "0.3.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "modules"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
